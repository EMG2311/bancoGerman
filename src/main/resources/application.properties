spring.application.name=demo
# Sin perfil explícito se usa "local" (application-local.properties, fuera de git, con las credenciales)
spring.profiles.default=local

spring.datasource.url=jdbc:mysql://localhost:3306/deudas?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo maneja Flyway; Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracion=7d

# Proveedor de push: "expo" (envío real vía Expo -> FCM/APNs) o "log" (solo loguea)
app.push.proveedor=expo
app.push.expo.url=https://exp.host/--/api/v2
# Solo si se activa "enhanced push security" en el panel de EAS
app.push.expo.access-token=${EXPO_ACCESS_TOKEN:}
app.push.expo.intervalo-recibos=PT5M
